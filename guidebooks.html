<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Service Guidebooks | AI Field</title>
  <link rel="icon" href="./asset/logo.png" type="image/png" />
  <meta name="color-scheme" content="light dark" />
  <style>
    :root{
      --bg:#0b1220;
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --line:rgba(255,255,255,.14);
      --panel:rgba(15,23,42,.94);
      --panel2:rgba(30,41,59,.96);
      --panel3:rgba(2,6,23,.72);
      --field:rgba(255,255,255,.06);
      --chip:rgba(15,23,42,.06);
      --card:#f8fafc;
      --card2:#ffffff;
      --card-text:#0f172a;
      --card-muted:#475569;
      --band:#e2e8f0;
      --accent:#5eead4;
      --accent2:rgba(94,234,212,.15);
      --yellow:#fbbf24;
      --blue:#60a5fa;
      --shadow:0 18px 55px rgba(0,0,0,.35);
      --font:system-ui,-apple-system,Segoe UI,Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f6f7fb;
        --text:rgba(15,23,42,.92);
        --muted:rgba(17,24,39,.62);
        --line:rgba(17,24,39,.12);
        --panel:rgba(255,255,255,.72);
        --panel2:rgba(255,255,255,.92);
        --panel3:rgba(241,245,249,.90);
        --field:rgba(255,255,255,.98);
        --chip:rgba(15,23,42,.06);
        --card:#ffffff;
        --card2:#f8fafc;
        --card-text:#0f172a;
        --card-muted:#475569;
        --band:#e2e8f0;
        --accent:#0ea5e9;
        --accent2:rgba(14,165,233,.12);
        --shadow:0 18px 55px rgba(15,23,42,.10);
      }
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background:
        radial-gradient(1200px 500px at 15% 0%, rgba(94,234,212,.18), transparent 55%),
        radial-gradient(900px 450px at 95% 10%, rgba(251,191,36,.16), transparent 50%),
        radial-gradient(1000px 600px at 60% 120%, rgba(96,165,250,.14), transparent 55%),
        var(--bg);
      background-attachment: fixed;
    }
    button,input{font:inherit;}
    .wrap{max-width:1240px;margin:0 auto;padding:22px 18px 38px;}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:6px 2px 18px;}
    .brandline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .brandlogo{width:34px;height:34px;object-fit:contain;}
    h1{margin:0;font-size:20px;font-weight:900;}
    .beta-badge{
      display:inline-flex;align-items:center;justify-content:center;min-height:24px;
      border:1px solid rgba(251,191,36,.42);border-radius:999px;background:rgba(251,191,36,.14);
      color:var(--text);padding:4px 9px;font-size:11px;font-weight:950;
    }
    .sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.45;}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
    .btn{
      appearance:none;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.07);
      color:var(--text);min-height:34px;padding:8px 11px;font-size:13px;font-weight:800;text-decoration:none;
      cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    }
    .btn:hover{filter:brightness(1.08);}
    .btn.primary{background:var(--accent2);border-color:rgba(94,234,212,.36);}
    .toolbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:14px;}
    .search{
      width:100%;min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--field);
      color:var(--text);padding:9px 12px;outline:none;
    }
    .search:focus{border-color:rgba(94,234,212,.55);box-shadow:0 0 0 3px rgba(94,234,212,.16);}
    .panel{
      border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,var(--panel2),var(--panel));
      box-shadow:var(--shadow);overflow:hidden;
    }
    .panel-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel3);}
    .panel-title{margin:0;font-size:15px;font-weight:900;}
    .panel-meta{margin-top:4px;color:var(--muted);font-size:12px;}
    .panel-bd{padding:14px 16px;}
    .guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
    .service-card{
      display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;min-height:150px;
      border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,var(--card2),var(--card));
      color:var(--card-text);text-decoration:none;padding:12px;position:relative;overflow:hidden;
    }
    .service-card:hover{border-color:var(--accent);box-shadow:0 12px 30px rgba(14,165,233,.16);}
    .service-card.is-ready{
      border-color:color-mix(in srgb, var(--accent) 32%, rgba(15,23,42,.14));
      background:
        linear-gradient(135deg,color-mix(in srgb, var(--accent) 18%, transparent),transparent 58%),
        linear-gradient(180deg,var(--card2),var(--card));
    }
    .service-card.is-muted{
      border-color:rgba(100,116,139,.22);
      background:
        linear-gradient(135deg,rgba(100,116,139,.16),rgba(226,232,240,.58)),
        linear-gradient(180deg,var(--card2),var(--card));
    }
    .service-card.is-muted:hover{border-color:rgba(100,116,139,.45);box-shadow:0 12px 30px rgba(100,116,139,.14);}
    .service-hero{
      width:74px;height:74px;border-radius:8px;border:1px solid var(--line);background:#fff;
      object-fit:cover;align-self:start;
    }
    .service-card.is-muted .service-hero{filter:grayscale(.75) saturate(.62);opacity:.78;}
    .service-card.is-muted .service-name{color:#334155;}
    .service-card.is-muted .service-role{color:#64748b;}
    .service-card.is-muted .chip{background:rgba(241,245,249,.86);color:#64748b;border-color:rgba(100,116,139,.22);}
    .service-name{font-size:15px;font-weight:900;margin:0 0 6px;line-height:1.25;}
    .service-role{margin:0;color:var(--card-muted);font-size:12px;line-height:1.45;}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
    .chip{
      display:inline-flex;align-items:center;border:1px solid rgba(15,23,42,.18);border-radius:999px;
      background:#fff;color:var(--card-text);padding:5px 10px;font-size:11px;font-weight:900;
      box-shadow:0 2px 8px rgba(15,23,42,.08);
    }
    .detail-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start;}
    .side{position:sticky;top:18px;}
    .side-list{display:grid;gap:6px;}
    .side-link{
      display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);
      color:var(--text);text-decoration:none;padding:9px;font-size:12px;font-weight:850;
    }
    .side-link.active{background:var(--accent2);border-color:rgba(94,234,212,.36);}
    .side-link.is-muted{background:rgba(148,163,184,.16);color:#64748b;border-color:rgba(148,163,184,.18);}
    .side-link.is-muted .dot{background:#94a3b8 !important;}
    .side-link.is-muted.active{background:rgba(148,163,184,.24);border-color:rgba(148,163,184,.36);}
    .dot{width:9px;height:9px;border-radius:999px;background:var(--accent);flex:0 0 auto;}
    .hero{
      display:block;
      border:1px solid color-mix(in srgb, var(--accent) 34%, var(--line));border-radius:8px;
      background:
        linear-gradient(135deg,color-mix(in srgb, var(--accent) 22%, transparent),transparent 54%),
        linear-gradient(180deg,var(--panel2),var(--panel));
      overflow:hidden;
    }
    .hero-copy{padding:18px;}
    .eyebrow{color:var(--muted);font-size:12px;font-weight:900;margin-bottom:8px;text-align:right;}
    .hero h2{margin:0;font-size:26px;line-height:1.18;font-weight:950;}
    .hero p{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.58;}
    .hero .chip{
      border-color:rgba(94,234,212,.38);background:rgba(255,255,255,.94);color:#0f172a;
      box-shadow:0 5px 14px rgba(0,0,0,.16);
    }
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 0 10px;}
    .section-head h3{margin:0;font-size:16px;font-weight:950;}
    .feature-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .feature{
      border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,var(--card2),var(--card));overflow:hidden;
    }
    .feature-link{display:flex;flex-direction:column;color:var(--card-text);text-decoration:none;min-height:100%;}
    .feature-link:hover{border-color:var(--accent);box-shadow:0 14px 32px rgba(14,165,233,.16);}
    .feature img{width:100%;height:168px;object-fit:cover;background:#fff;display:block;border-bottom:1px solid var(--line);}
    .feature-body{padding:12px;background:linear-gradient(180deg,#eef6ff,#f8fbff);}
    .feature h4{margin:0 0 9px;font-size:14px;font-weight:950;line-height:1.35;}
    .feature-summary{color:var(--card-muted);font-size:12px;line-height:1.5;margin:0 0 12px;}
    .feature-footer{margin-top:auto;display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--card-text);font-size:12px;font-weight:950;}
    .kv{display:grid;gap:7px;}
    .kv-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;font-size:12px;line-height:1.45;}
    .kv-row b{color:var(--text);}
    .kv-row span{color:var(--muted);}
    .tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
    .feature-detail-shell{display:grid;gap:12px;}
    .feature-detail-head{
      border:1px solid var(--line);border-radius:8px;background:linear-gradient(135deg,var(--panel2),var(--panel3));padding:16px;
    }
    .crumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:850;margin-bottom:10px;}
    .crumb a{color:var(--accent);text-decoration:none;}
    .feature-detail-head h3{margin:0;font-size:24px;line-height:1.22;font-weight:950;}
    .feature-detail-head p{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.62;}
    .detail-flow{display:grid;gap:10px;}
    .detail-block{border:1px solid rgba(15,23,42,.14);border-radius:8px;background:var(--card);color:var(--card-text);padding:13px;}
    .detail-block h4{margin:0 0 8px;font-size:13px;font-weight:950;}
    .detail-block p{margin:0;color:var(--card-muted);font-size:12px;line-height:1.58;}
    .detail-block.full{background:linear-gradient(180deg,var(--card2),var(--card));}
    .detail-block.emphasis{border-color:rgba(14,165,233,.28);background:#f8fafc;}
    .step-list{display:grid;gap:12px;margin:0;padding:0;list-style:none;}
    .step-card{display:block;border:1px solid rgba(15,23,42,.12);border-radius:8px;background:#fff;overflow:hidden;}
    .step-shot{position:relative;background:#fff;border-bottom:1px solid rgba(15,23,42,.12);}
    .step-shot img{width:100%;height:auto;object-fit:contain;display:block;background:#fff;}
    .step-badge{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#0f172a;color:#fff;padding:6px 10px;font-size:11px;font-weight:950;box-shadow:0 8px 18px rgba(15,23,42,.18);}
    .step-copy{padding:14px;display:grid;align-content:start;gap:8px;background:linear-gradient(180deg,#eef6ff,#f8fbff);}
    .step-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:950;color:var(--card-text);}
    .step-no{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:rgba(14,165,233,.14);color:var(--card-text);font-size:12px;font-weight:950;flex:0 0 auto;}
    .step-body{display:block;color:var(--card-muted);font-size:13px;line-height:1.58;}
    .audio-samples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .audio-card{border:1px solid rgba(15,23,42,.12);border-radius:8px;background:#fff;padding:12px;display:grid;gap:9px;}
    .audio-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--card-text);font-size:13px;font-weight:950;}
    .audio-duration{color:var(--card-muted);font-size:12px;font-weight:800;}
    .audio-card audio{width:100%;height:34px;}
    .video-samples{display:grid;gap:10px;}
    .video-card{border:1px solid rgba(15,23,42,.12);border-radius:8px;background:#fff;padding:12px;display:grid;gap:10px;}
    .video-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--card-text);font-size:13px;font-weight:950;}
    .video-duration{color:var(--card-muted);font-size:12px;font-weight:800;}
    .video-card video{width:100%;height:auto;max-height:560px;background:#000;border-radius:6px;display:block;}
    .image-samples{display:grid;gap:10px;}
    .image-card{border:1px solid rgba(15,23,42,.12);border-radius:8px;background:#fff;padding:12px;display:grid;gap:10px;}
    .image-card-head{color:var(--card-text);font-size:13px;font-weight:950;}
    .image-card img{width:100%;height:auto;max-height:640px;object-fit:contain;background:#000;border-radius:6px;display:block;}
    .feature-nav{position:sticky;top:18px;}
    .feature-nav-list{display:grid;gap:6px;}
    .feature-nav-link{display:block;border:1px solid rgba(15,23,42,.14);border-radius:8px;background:var(--card);color:var(--card-text);text-decoration:none;padding:9px;font-size:12px;font-weight:850;line-height:1.35;}
    .feature-nav-link.active{background:#0f172a;color:#fff;border-color:rgba(94,234,212,.42);}
    .empty{border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);text-align:center;font-size:13px;}
    mark{background:rgba(251,191,36,.32);color:inherit;border-radius:4px;padding:0 2px;}
    @media (max-width:1040px){
      .guide-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
      .detail-layout{grid-template-columns:1fr;}
      .feature-nav{position:static;}
      .side{position:static;}
      .side-list{grid-template-columns:repeat(3,minmax(0,1fr));}
    }
    @media (max-width:760px){
      header{align-items:flex-start;flex-direction:column;}
      .actions{justify-content:flex-start;}
      .toolbar{grid-template-columns:1fr;}
      .guide-grid,.feature-list{grid-template-columns:1fr;}
      .service-card{grid-template-columns:58px minmax(0,1fr);min-height:128px;}
      .service-hero{width:58px;height:58px;}
      .hero{grid-template-columns:1fr;}
      .hero h2{font-size:22px;}
      .side-list{grid-template-columns:repeat(2,minmax(0,1fr));}
      .kv-row{grid-template-columns:1fr;}
      .audio-samples{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brandline">
          <img class="brandlogo" src="./asset/logo.png" alt="KNOC">
          <h1>AI 서비스 가이드북</h1>
          <span class="beta-badge">beta 버전</span>
        </div>
        <div class="sub">기능 중심으로 정리한 서비스별 사용 안내</div>
      </div>
      <div class="actions">
        <a class="btn" href="./index.html">AI Field</a>
        <a class="btn" href="./prompts.html">프롬프트 예시</a>
        <a class="btn primary" href="./guidebooks.html">가이드 목록</a>
      </div>
    </header>

    <div id="app"></div>
  </div>

  <script src="./guidebook-data.js"></script>
  <script>
    const $app = document.querySelector("#app");
    const state = { q: "" };
    const data = window.SERVICE_GUIDES || { services: [] };
    const READY_GUIDES = new Set(["chatgpt", "genspark"]);

    function esc(v){
      return String(v ?? "").replace(/[&<>"']/g, (ch) => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;"
      }[ch]));
    }

    function polite(v){
      let text = String(v ?? "");
      const rules = [
        [/해야 한다(?=\.|$)/g, "해야 합니다"],
        [/사용한다(?=\.|$)/g, "사용합니다"],
        [/활용한다(?=\.|$)/g, "활용합니다"],
        [/확인한다(?=\.|$)/g, "확인합니다"],
        [/선택한다(?=\.|$)/g, "선택합니다"],
        [/입력한다(?=\.|$)/g, "입력합니다"],
        [/요청한다(?=\.|$)/g, "요청합니다"],
        [/생성한다(?=\.|$)/g, "생성합니다"],
        [/정리한다(?=\.|$)/g, "정리합니다"],
        [/작성한다(?=\.|$)/g, "작성합니다"],
        [/분석한다(?=\.|$)/g, "분석합니다"],
        [/변환한다(?=\.|$)/g, "변환합니다"],
        [/만든다(?=\.|$)/g, "만듭니다"],
        [/올린다(?=\.|$)/g, "올립니다"],
        [/열어 본다(?=\.|$)/g, "열어 봅니다"],
        [/본다(?=\.|$)/g, "봅니다"],
        [/쓴다(?=\.|$)/g, "사용합니다"],
        [/준다(?=\.|$)/g, "줍니다"],
        [/된다(?=\.|$)/g, "됩니다"],
        [/있다(?=\.|$)/g, "있습니다"],
        [/없다(?=\.|$)/g, "없습니다"],
        [/좋다(?=\.|$)/g, "좋습니다"],
        [/쉽다(?=\.|$)/g, "쉽습니다"],
        [/어렵다(?=\.|$)/g, "어렵습니다"],
        [/강하다(?=\.|$)/g, "강합니다"],
        [/적합하다(?=\.|$)/g, "적합합니다"],
        [/필요하다(?=\.|$)/g, "필요합니다"],
        [/중요하다(?=\.|$)/g, "중요합니다"],
        [/가능하다(?=\.|$)/g, "가능합니다"],
        [/한다(?=\.|$)/g, "합니다"]
      ];
      for(const [from, to] of rules) text = text.replace(from, to);
      return text;
    }

    function copy(v){
      return esc(polite(v));
    }

    function serviceUrl(id){
      return `./guidebooks.html?service=${encodeURIComponent(id)}`;
    }

    function featureUrl(serviceId, index){
      return `${serviceUrl(serviceId)}&feature=${encodeURIComponent(index)}`;
    }

    function currentService(){
      const params = new URLSearchParams(location.search);
      const id = params.get("service") || "";
      return data.services.find((it) => it.id === id) || null;
    }

    function currentFeatureIndex(service){
      const params = new URLSearchParams(location.search);
      if(!params.has("feature")) return null;
      const idx = Number(params.get("feature"));
      const features = service.sections || [];
      if(!Number.isInteger(idx) || idx < 0 || idx >= features.length) return null;
      return idx;
    }

    function faviconUrl(domain){
      return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
    }

    function matchText(service){
      return [service.name, service.display, service.role, service.overview, ...(service.features || [])].join(" ").toLowerCase();
    }

    function serviceCardClass(service){
      return READY_GUIDES.has(service.id) ? " is-ready" : " is-muted";
    }

    function highlight(text){
      const q = state.q.trim();
      const raw = esc(text);
      if(q.length < 2) return raw;
      const safe = q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return raw.replace(new RegExp(safe, "gi"), (m) => `<mark>${esc(m)}</mark>`);
    }

    function asList(value){
      if(Array.isArray(value)) return value.filter(Boolean);
      const text = String(value || "").trim();
      if(!text) return [];
      return text.split(/\n+/).map((it) => it.trim()).filter(Boolean);
    }

    function defaultSteps(feature){
      const explicit = asList(feature.steps);
      if(explicit.length) return explicit.map((step, idx) => {
        if(typeof step === "object" && step !== null){
          return {
            title: step.title || `따라하기 ${idx + 1}`,
            body: step.body || step.text || "",
            image: step.image || feature.image,
            badge: step.badge || (idx === 0 ? "클릭할 곳" : "확인할 곳")
          };
        }
        return {
          title: `따라하기 ${idx + 1}`,
          body: step,
          image: feature.image,
          badge: idx === 0 ? "클릭할 곳" : "확인할 곳"
        };
      });
      return [
        { title: "기능 버튼이나 입력창을 찾습니다", body: feature.location || "서비스 화면에서 이 기능을 실행하는 버튼이나 입력창을 찾습니다.", image: feature.image, badge: "클릭할 곳" },
        { title: "요청 내용을 입력합니다", body: feature.how || "원하는 결과물, 참고 자료, 조건을 입력합니다.", image: feature.image, badge: "입력할 곳" },
        { title: "결과를 확인하고 수정합니다", body: "생성된 결과를 확인한 뒤 필요한 부분을 다시 요청하거나 업무 문서에 맞게 정리합니다.", image: feature.image, badge: "확인할 곳" }
      ];
    }

    function renderList(){
      const q = state.q.trim().toLowerCase();
      const services = q ? data.services.filter((s) => matchText(s).includes(q)) : data.services;
      $app.innerHTML = `
        <div class="toolbar">
          <input class="search" id="guideSearch" type="search" placeholder="서비스명, 기능, 업무 상황 검색" value="${esc(state.q)}">
          <a class="btn primary" href="./guidebooks.html">전체 ${data.services.length}개</a>
        </div>
        <section class="panel" aria-labelledby="guideListTitle">
          <div class="panel-hd">
            <div>
              <h2 class="panel-title" id="guideListTitle">서비스 선택</h2>
              <div class="panel-meta">기능과 업무 적용 방식만 정리했습니다.</div>
            </div>
          </div>
          <div class="panel-bd">
            <div class="guide-grid">
              ${services.map((s) => `
                <a class="service-card${serviceCardClass(s)}" href="${serviceUrl(s.id)}" style="--accent:${esc(s.tone || "#5eead4")}">
                  <img class="service-hero" src="${esc(s.hero)}" alt="${esc(s.display)} 화면">
                  <div>
                    <h3 class="service-name">${highlight(s.display)}</h3>
                    <p class="service-role">${highlight(polite(s.role || s.overview))}</p>
                    <div class="chips">
                      <span class="chip">${(s.sections || []).length}개 기능</span>
                      ${(s.features || []).slice(0, 2).map((f) => `<span class="chip">${esc(f)}</span>`).join("")}
                    </div>
                  </div>
                </a>
              `).join("") || `<div class="empty">검색 결과가 없습니다.</div>`}
            </div>
          </div>
        </section>
      `;
      const input = document.querySelector("#guideSearch");
      input.addEventListener("input", (e) => {
        state.q = e.target.value;
        renderList();
        const next = document.querySelector("#guideSearch");
        next.focus();
        next.setSelectionRange(next.value.length, next.value.length);
      });
    }

    function renderSide(activeId){
      return `
        <aside class="panel side">
          <div class="panel-hd">
            <div>
              <h2 class="panel-title">서비스</h2>
              <div class="panel-meta">${data.services.length}개 가이드</div>
            </div>
          </div>
          <div class="panel-bd">
            <div class="side-list">
              ${data.services.map((s) => `
                <a class="side-link${s.id === activeId ? " active" : ""}${serviceCardClass(s)}" href="${serviceUrl(s.id)}">
                  <span class="dot" style="background:${esc(s.tone || "#5eead4")}"></span>
                  <span>${esc(s.name)}</span>
                </a>
              `).join("")}
            </div>
          </div>
        </aside>
      `;
    }

    function renderFeatureIndex(service, features){
      return `
        <div class="section-head">
          <h3>기능별 사용법</h3>
        </div>
        <div class="feature-list">
          ${features.map((f, idx) => `
            <a class="feature feature-link" href="${featureUrl(service.id, idx)}">
              <img src="${esc(f.image || service.hero)}" alt="${esc(service.display)} - ${esc(f.title)}">
              <div class="feature-body">
                <h4>${esc(f.title)}</h4>
                <p class="feature-summary">${copy(f.when || f.how || f.location)}</p>
                <div class="feature-footer">
                  <span>자세히 보기</span>
                </div>
              </div>
            </a>
          `).join("")}
        </div>
      `;
    }

    function renderFeatureNav(service, activeIdx){
      const features = service.sections || [];
      return `
        <aside class="panel feature-nav">
          <div class="panel-hd">
            <div>
              <h3 class="panel-title">기능 목록</h3>
              <div class="panel-meta">${features.length}개 기능</div>
            </div>
          </div>
          <div class="panel-bd">
            <div class="feature-nav-list">
              ${features.map((f, idx) => `
                <a class="feature-nav-link${idx === activeIdx ? " active" : ""}" href="${featureUrl(service.id, idx)}">
                  ${esc(f.title)}
                </a>
              `).join("")}
            </div>
          </div>
        </aside>
      `;
    }

    function renderFeatureDetail(service, feature, idx){
      const features = service.sections || [];
      const steps = defaultSteps(feature);
      const audioSamples = asList(feature.audioSamples);
      const videoSamples = asList(feature.videoSamples);
      const imageSamples = asList(feature.imageSamples);
      return `
        <div class="section-head">
          <h3>기능 상세</h3>
          <a class="btn" href="${serviceUrl(service.id)}">기능 목록</a>
        </div>
        <div class="feature-detail-shell">
          <section class="feature-detail-head">
            <div class="crumb">
              <a href="${serviceUrl(service.id)}">${esc(service.display)}</a>
              <span>/</span>
              <span>${esc(feature.title)}</span>
            </div>
            <h3>${esc(feature.title)}</h3>
            <p>${copy(feature.when || service.role)}</p>
          </section>

          <div class="detail-flow">
            <section class="detail-block full">
              <h4>따라하기</h4>
              <ol class="step-list">
                ${steps.map((step, stepIdx) => `
                  <li class="step-card">
                    <div class="step-shot">
                      <img src="${esc(step.image || feature.image || service.hero)}" alt="${esc(feature.title)} - ${esc(step.title || `따라하기 ${stepIdx + 1}`)}">
                      <span class="step-badge">${esc(step.badge || "확인할 곳")}</span>
                    </div>
                    <div class="step-copy">
                      <span class="step-title"><span class="step-no">${stepIdx + 1}</span>${esc(step.title || `따라하기 ${stepIdx + 1}`)}</span>
                      <span class="step-body">${copy(step.body || step)}</span>
                    </div>
                  </li>
                `).join("")}
              </ol>
            </section>
            ${audioSamples.length ? `
              <section class="detail-block full">
                <h4>결과물 샘플</h4>
                <div class="audio-samples">
                  ${audioSamples.map((sample, sampleIdx) => `
                    <div class="audio-card">
                      <div class="audio-card-head">
                        <span>${esc(sample.title || `결과물 ${sampleIdx + 1}`)}</span>
                        <span class="audio-duration">${esc(sample.duration || "")}</span>
                      </div>
                      <audio controls preload="metadata" src="${esc(sample.src)}"></audio>
                    </div>
                  `).join("")}
                </div>
              </section>
            ` : ""}
            ${videoSamples.length ? `
              <section class="detail-block full">
                <h4>결과물 샘플</h4>
                <div class="video-samples">
                  ${videoSamples.map((sample, sampleIdx) => `
                    <div class="video-card">
                      <div class="video-card-head">
                        <span>${esc(sample.title || `결과물 ${sampleIdx + 1}`)}</span>
                        <span class="video-duration">${esc(sample.duration || "")}</span>
                      </div>
                      <video controls preload="metadata" src="${esc(sample.src)}"></video>
                    </div>
                  `).join("")}
                </div>
              </section>
            ` : ""}
            ${imageSamples.length ? `
              <section class="detail-block full">
                <h4>결과물 샘플</h4>
                <div class="image-samples">
                  ${imageSamples.map((sample, sampleIdx) => `
                    <div class="image-card">
                      <div class="image-card-head">${esc(sample.title || `결과물 ${sampleIdx + 1}`)}</div>
                      <img src="${esc(sample.src)}" alt="${esc(sample.title || `결과물 ${sampleIdx + 1}`)}">
                    </div>
                  `).join("")}
                </div>
              </section>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderDetail(service){
      const features = service.sections || [];
      const keyFeatures = (service.features || []).slice(0, 8);
      const featureIdx = currentFeatureIndex(service);
      const selectedFeature = featureIdx === null ? null : features[featureIdx];
      const guideDate = service.guideDate || ((service.basis || "").match(/\d{4}-\d{2}-\d{2}/) || [data.generatedAt || ""])[0];
      $app.innerHTML = `
        <div class="detail-layout">
          ${selectedFeature ? renderFeatureNav(service, featureIdx) : renderSide(service.id)}
          <main>
            <section class="hero" style="--accent:${esc(service.tone || "#5eead4")}">
              <div class="hero-copy">
                ${guideDate ? `<div class="eyebrow">작성 기준일: ${esc(guideDate)}</div>` : ""}
                <h2>${esc(service.display)}</h2>
                <p>${copy(service.overview || service.role)}</p>
                <div class="chips">
                  ${keyFeatures.map((f) => `<span class="chip">${esc(f)}</span>`).join("")}
                </div>
              </div>
            </section>

            ${selectedFeature ? renderFeatureDetail(service, selectedFeature, featureIdx) : renderFeatureIndex(service, features)}
          </main>
        </div>
      `;
    }

    const selected = currentService();
    if(selected) renderDetail(selected);
    else renderList();
  </script>
</body>
</html>
