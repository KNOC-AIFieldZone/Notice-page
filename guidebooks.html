<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Service Guidebooks | AI Field</title>
  <link rel="icon" href="./asset/logo.png" type="image/png" />
  <meta name="color-scheme" content="light dark" />
  <style>
    :root{
      --bg:#0b1220;
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.68);
      --line:rgba(255,255,255,.14);
      --panel:rgba(15,23,42,.94);
      --panel2:rgba(30,41,59,.96);
      --panel3:rgba(2,6,23,.72);
      --field:rgba(255,255,255,.06);
      --chip:rgba(15,23,42,.06);
      --card:#f8fafc;
      --card2:#ffffff;
      --card-text:#0f172a;
      --card-muted:#475569;
      --band:#e2e8f0;
      --accent:#5eead4;
      --accent2:rgba(94,234,212,.15);
      --yellow:#fbbf24;
      --blue:#60a5fa;
      --shadow:0 18px 55px rgba(0,0,0,.35);
      --font:system-ui,-apple-system,Segoe UI,Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    }
    @media (prefers-color-scheme: light){
      :root{
        --bg:#f6f7fb;
        --text:rgba(15,23,42,.92);
        --muted:rgba(17,24,39,.62);
        --line:rgba(17,24,39,.12);
        --panel:rgba(255,255,255,.72);
        --panel2:rgba(255,255,255,.92);
        --panel3:rgba(241,245,249,.90);
        --field:rgba(255,255,255,.98);
        --chip:rgba(15,23,42,.06);
        --card:#ffffff;
        --card2:#f8fafc;
        --card-text:#0f172a;
        --card-muted:#475569;
        --band:#e2e8f0;
        --accent:#0ea5e9;
        --accent2:rgba(14,165,233,.12);
        --shadow:0 18px 55px rgba(15,23,42,.10);
      }
    }
    *{box-sizing:border-box;}
    body{
      margin:0;
      font-family:var(--font);
      color:var(--text);
      background:
        radial-gradient(1200px 500px at 15% 0%, rgba(94,234,212,.18), transparent 55%),
        radial-gradient(900px 450px at 95% 10%, rgba(251,191,36,.16), transparent 50%),
        radial-gradient(1000px 600px at 60% 120%, rgba(96,165,250,.14), transparent 55%),
        var(--bg);
      background-attachment: fixed;
    }
    button,input{font:inherit;}
    .wrap{max-width:1240px;margin:0 auto;padding:22px 18px 38px;}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;padding:6px 2px 18px;}
    .brandline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .brandlogo{width:34px;height:34px;object-fit:contain;}
    h1{margin:0;font-size:20px;font-weight:900;}
    .beta-badge{
      display:inline-flex;align-items:center;justify-content:center;min-height:24px;
      border:1px solid rgba(251,191,36,.42);border-radius:999px;background:rgba(251,191,36,.14);
      color:var(--text);padding:4px 9px;font-size:11px;font-weight:950;
    }
    .sub{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.45;}
    .actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
    .btn{
      appearance:none;border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.07);
      color:var(--text);min-height:34px;padding:8px 11px;font-size:13px;font-weight:800;text-decoration:none;
      cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
    }
    .btn:hover{filter:brightness(1.08);}
    .btn.primary{background:var(--accent2);border-color:rgba(94,234,212,.36);}
    .panel{
      border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,var(--panel2),var(--panel));
      box-shadow:var(--shadow);overflow:hidden;
    }
    .panel-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel3);}
    .panel-title{margin:0;font-size:15px;font-weight:900;}
    .panel-meta{margin-top:4px;color:var(--muted);font-size:12px;}
    .panel-count{flex:0 0 auto;color:var(--muted);font-size:12px;font-weight:900;white-space:nowrap;}
    .panel-bd{padding:14px 16px;}
    .guide-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
    .service-card{
      display:grid;grid-template-columns:74px minmax(0,1fr);gap:12px;min-height:150px;
      border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,var(--card2),var(--card));
      color:var(--card-text);text-decoration:none;padding:12px;position:relative;overflow:hidden;
    }
    .service-card:hover{border-color:var(--accent);box-shadow:0 12px 30px rgba(14,165,233,.16);}
    .service-card.is-ready{
      border-color:color-mix(in srgb, var(--accent) 32%, rgba(15,23,42,.14));
      background:
        linear-gradient(135deg,color-mix(in srgb, var(--accent) 18%, transparent),transparent 58%),
        linear-gradient(180deg,var(--card2),var(--card));
    }
    .service-card.is-muted{
      border-color:rgba(100,116,139,.22);
      background:
        linear-gradient(135deg,rgba(100,116,139,.16),rgba(226,232,240,.58)),
        linear-gradient(180deg,var(--card2),var(--card));
    }
    .service-card.is-muted:hover{border-color:rgba(100,116,139,.45);box-shadow:0 12px 30px rgba(100,116,139,.14);}
    .service-hero{
      width:74px;height:74px;border-radius:8px;border:1px solid var(--line);background:#fff;
      object-fit:cover;align-self:start;
    }
    .service-card.service-notebooklm .service-hero{width:100%;height:auto;object-fit:contain;}
    .service-card.service-gemini .service-hero{width:100%;height:auto;object-fit:contain;}
    .service-card.is-muted .service-hero{filter:grayscale(.75) saturate(.62);opacity:.78;}
    .service-card.is-muted .service-name{color:#334155;}
    .service-card.is-muted .service-role{color:#64748b;}
    .service-card.is-muted .chip{background:rgba(241,245,249,.86);color:#64748b;border-color:rgba(100,116,139,.22);}
    .service-name{font-size:15px;font-weight:900;margin:0 0 6px;line-height:1.25;}
    .service-role{margin:0;color:var(--card-muted);font-size:12px;line-height:1.45;}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
    .chip{
      display:inline-flex;align-items:center;border:1px solid rgba(15,23,42,.18);border-radius:999px;
      background:#fff;color:var(--card-text);padding:5px 10px;font-size:11px;font-weight:900;
      box-shadow:0 2px 8px rgba(15,23,42,.08);
    }
    .detail-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:14px;align-items:start;}
    .side{position:sticky;top:18px;}
    .side-list{display:grid;gap:6px;}
    .side-link{
      display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);
      color:var(--text);text-decoration:none;padding:9px;font-size:12px;font-weight:850;
    }
    .side-link.active{background:var(--accent2);border-color:rgba(94,234,212,.36);}
    .side-link.is-muted{background:rgba(148,163,184,.16);color:#64748b;border-color:rgba(148,163,184,.18);}
    .side-link.is-muted .dot{background:#94a3b8 !important;}
    .side-link.is-muted.active{background:rgba(148,163,184,.24);border-color:rgba(148,163,184,.36);}
    .dot{width:9px;height:9px;border-radius:999px;background:var(--accent);flex:0 0 auto;}
    .hero{
      display:block;
      border:1px solid color-mix(in srgb, var(--accent) 34%, var(--line));border-radius:8px;
      background:
        linear-gradient(135deg,color-mix(in srgb, var(--accent) 22%, transparent),transparent 54%),
        linear-gradient(180deg,var(--panel2),var(--panel));
      overflow:hidden;
    }
    .hero-copy{padding:18px;}
    .guide-date{color:var(--muted);font-size:12px;font-weight:900;margin-bottom:10px;text-align:right;}
    .hero h2{margin:0;font-size:26px;line-height:1.18;font-weight:950;}
    .hero p{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.58;}
    .hero .chip{
      border-color:rgba(94,234,212,.38);background:rgba(255,255,255,.94);color:#0f172a;
      box-shadow:0 5px 14px rgba(0,0,0,.16);
    }
    .hero.hero-light{
      color:#0f172a;
      background:
        linear-gradient(135deg,color-mix(in srgb, var(--accent) 22%, #fff),rgba(255,255,255,.96) 62%),
        #fff;
    }
    .hero.hero-light .guide-date,.hero.hero-light p{color:#475569;}
    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 0 10px;}
    .section-head h3{margin:0;font-size:16px;font-weight:950;}
    .feature-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .feature{
      border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,var(--card2),var(--card));overflow:hidden;
    }
    .feature-link{display:flex;flex-direction:column;color:var(--card-text);text-decoration:none;min-height:100%;}
    .feature-link:hover{border-color:var(--accent);box-shadow:0 14px 32px rgba(14,165,233,.16);}
    .feature img{width:100%;height:168px;object-fit:contain;background:#fff;display:block;border-bottom:1px solid var(--line);}
    main.service-notebooklm .feature img{width:100%;height:auto;object-fit:contain;}
    main.service-gemini .feature img{width:100%;height:auto;object-fit:contain;}
    .feature-body{padding:12px;background:linear-gradient(180deg,#eef6ff,#f8fbff);}
    .feature h4{margin:0 0 9px;font-size:14px;font-weight:950;line-height:1.35;}
    .feature-summary{color:var(--card-muted);font-size:12px;line-height:1.5;margin:0 0 12px;}
    .feature-footer{margin-top:auto;display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--card-text);font-size:12px;font-weight:950;}
    .kv{display:grid;gap:7px;}
    .kv-row{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;font-size:12px;line-height:1.45;}
    .kv-row b{color:var(--text);}
    .kv-row span{color:var(--muted);}
    .tips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
    .feature-detail-shell{display:grid;gap:12px;}
    .feature-detail-head{
      border:1px solid var(--line);border-radius:8px;background:linear-gradient(135deg,var(--panel2),var(--panel3));padding:16px;
    }
    .crumb{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;font-weight:850;margin-bottom:10px;}
    .crumb a{color:var(--accent);text-decoration:none;}
    .feature-detail-head h3{margin:0;font-size:24px;line-height:1.22;font-weight:950;}
    .feature-detail-head p{margin:10px 0 0;color:var(--muted);font-size:13px;line-height:1.62;}
    .detail-flow{display:grid;gap:10px;}
    .detail-block{border:1px solid rgba(15,23,42,.14);border-radius:8px;background:var(--card);color:var(--card-text);padding:13px;}
    .detail-block h4{margin:0 0 8px;font-size:13px;font-weight:950;}
    .detail-block p{margin:0;color:var(--card-muted);font-size:12px;line-height:1.58;}
    .detail-block.full{background:linear-gradient(180deg,var(--card2),var(--card));}
    .detail-block.emphasis{border-color:rgba(14,165,233,.28);background:#f8fafc;}
    .step-list{display:grid;gap:12px;margin:0;padding:0;list-style:none;}
    .step-card{display:block;border:1px solid rgba(15,23,42,.12);border-radius:8px;background:#fff;overflow:hidden;}
    .step-shot{position:relative;background:#fff;border-bottom:1px solid rgba(15,23,42,.12);overflow:hidden;}
    .step-shot img{width:100%;height:auto;object-fit:contain;display:block;background:#fff;cursor:zoom-in;transition:filter .18s ease,transform .24s ease;}
    .step-shot:hover img{filter:brightness(.94);transform:scale(1.006);}
    .step-shot::after{
      content:"확대 보기";position:absolute;right:10px;bottom:10px;pointer-events:none;
      display:inline-flex;align-items:center;justify-content:center;border-radius:999px;
      background:rgba(15,23,42,.84);color:#fff;padding:6px 10px;font-size:11px;font-weight:900;
      opacity:0;transform:translateY(5px);transition:opacity .18s ease,transform .18s ease;
      box-shadow:0 8px 20px rgba(15,23,42,.24);
    }
    .step-shot:hover::after,.step-shot:focus-within::after{opacity:1;transform:translateY(0);}
    .step-badge{position:absolute;left:10px;top:10px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#0f172a;color:#fff;padding:6px 10px;font-size:11px;font-weight:950;box-shadow:0 8px 18px rgba(15,23,42,.18);}
    .step-copy{padding:14px;display:grid;align-content:start;gap:8px;background:linear-gradient(180deg,#eef6ff,#f8fbff);}
    .step-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:950;color:var(--card-text);}
    .step-no{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:rgba(14,165,233,.14);color:var(--card-text);font-size:12px;font-weight:950;flex:0 0 auto;}
    .step-body{display:block;color:var(--card-muted);font-size:13px;line-height:1.58;}
    .audio-samples{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .audio-card{border:1px solid rgba(15,23,42,.12);border-radius:8px;background:#fff;padding:12px;display:grid;gap:9px;}
    .audio-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--card-text);font-size:13px;font-weight:950;}
    .audio-duration{color:var(--card-muted);font-size:12px;font-weight:800;}
    .audio-card audio{width:100%;height:34px;}
    .video-samples{display:grid;gap:10px;}
    .video-card{border:1px solid rgba(15,23,42,.12);border-radius:8px;background:#fff;padding:12px;display:grid;gap:10px;}
    .video-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--card-text);font-size:13px;font-weight:950;}
    .video-duration{color:var(--card-muted);font-size:12px;font-weight:800;}
    .video-card video{width:100%;height:auto;max-height:560px;background:#000;border-radius:6px;display:block;}
    .image-samples{display:grid;gap:10px;}
    .image-card{border:1px solid rgba(15,23,42,.12);border-radius:8px;background:#fff;padding:12px;display:grid;gap:10px;}
    .image-card-head{color:var(--card-text);font-size:13px;font-weight:950;}
    .image-card img{width:100%;height:auto;max-height:640px;object-fit:contain;background:#000;border-radius:6px;display:block;cursor:zoom-in;}
    .zoomable-guide-image{outline:none;}
    .zoomable-guide-image:focus-visible{box-shadow:0 0 0 4px rgba(14,165,233,.38);}
    body.lightbox-open{overflow:hidden;}
    .image-lightbox{
      position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;
      background:rgba(2,6,23,.74);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      opacity:0;visibility:hidden;pointer-events:none;
      transition:opacity .24s ease,visibility 0s linear .36s;
    }
    .image-lightbox.is-open{opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s;}
    .image-lightbox-backdrop{position:absolute;inset:0;z-index:0;cursor:zoom-out;}
    .image-lightbox-dismiss{position:absolute;z-index:2;border:0;background:transparent;padding:0;cursor:zoom-out;}
    .image-lightbox-dismiss.top{left:0;right:0;top:0;height:max(24px,calc((100vh - 920px) / 2));}
    .image-lightbox-dismiss.bottom{left:0;right:0;bottom:0;height:max(24px,calc((100vh - 920px) / 2));}
    .image-lightbox-dismiss.left{left:0;top:0;bottom:0;width:max(24px,calc((100vw - 1500px) / 2));}
    .image-lightbox-dismiss.right{right:0;top:0;bottom:0;width:max(24px,calc((100vw - 1500px) / 2));}
    .image-lightbox-panel{
      width:min(1500px,calc(100vw - 48px));height:min(920px,calc(100vh - 48px));
      display:grid;grid-template-rows:auto minmax(0,1fr);overflow:hidden;
      border:1px solid rgba(255,255,255,.22);border-radius:16px;background:#090f1b;
      box-shadow:0 32px 100px rgba(0,0,0,.58);
      position:relative;z-index:1;
      opacity:0;transform:scale(.76) translateY(18px);
      transition:opacity .22s ease,transform .34s cubic-bezier(.18,.9,.24,1.18);
    }
    .image-lightbox.is-open .image-lightbox-panel{opacity:1;transform:scale(1) translateY(0);}
    .image-lightbox-toolbar{
      display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:54px;
      padding:9px 10px 9px 16px;border-bottom:1px solid rgba(255,255,255,.14);
      color:#fff;background:rgba(15,23,42,.96);
    }
    .image-lightbox-heading{min-width:0;display:grid;gap:2px;}
    .image-lightbox-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:900;}
    .image-lightbox-help{color:rgba(255,255,255,.62);font-size:11px;font-weight:700;}
    .image-lightbox-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
    .image-lightbox-btn{
      appearance:none;display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;
      border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(255,255,255,.08);
      color:#fff;padding:0 10px;font-size:16px;font-weight:900;cursor:pointer;
      transition:background .15s ease,transform .15s ease;
    }
    .image-lightbox-btn:hover{background:rgba(255,255,255,.16);}
    .image-lightbox-btn:active{transform:scale(.94);}
    .image-lightbox-btn.zoom-value{min-width:58px;font-size:12px;}
    .image-lightbox-btn.close{font-size:22px;line-height:1;}
    .image-lightbox-viewport{
      position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
      background:
        linear-gradient(45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%),
        linear-gradient(45deg,rgba(255,255,255,.035) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.035) 75%),
        #050914;
      background-size:24px 24px;background-position:0 0,12px 12px;
      cursor:grab;touch-action:none;user-select:none;
    }
    .image-lightbox-viewport.is-dragging{cursor:grabbing;}
    .image-lightbox-image{
      display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
      transform:translate3d(0,0,0) scale(1);transform-origin:center center;
      will-change:transform;pointer-events:none;-webkit-user-drag:none;
    }
    .feature-nav{position:sticky;top:18px;}
    .feature-nav-list{display:grid;gap:6px;}
    .feature-nav-link{display:block;border:1px solid rgba(15,23,42,.14);border-radius:8px;background:var(--card);color:var(--card-text);text-decoration:none;padding:9px;font-size:12px;font-weight:850;line-height:1.35;}
    .feature-nav-link.active{background:#0f172a;color:#fff;border-color:rgba(94,234,212,.42);}
    .empty{border:1px dashed var(--line);border-radius:8px;padding:18px;color:var(--muted);text-align:center;font-size:13px;}
    @media (max-width:1040px){
      .guide-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
      .detail-layout{grid-template-columns:1fr;}
      .feature-nav{position:static;}
      .side{position:static;}
      .side-list{grid-template-columns:repeat(3,minmax(0,1fr));}
    }
    @media (max-width:760px){
      header{align-items:flex-start;flex-direction:column;}
      .actions{justify-content:flex-start;}
      .guide-grid,.feature-list{grid-template-columns:1fr;}
      .service-card{grid-template-columns:58px minmax(0,1fr);min-height:128px;}
      .service-hero{width:58px;height:58px;}
      .hero{grid-template-columns:1fr;}
      .hero h2{font-size:22px;}
      .side-list{grid-template-columns:repeat(2,minmax(0,1fr));}
      .kv-row{grid-template-columns:1fr;}
      .audio-samples{grid-template-columns:1fr;}
      .image-lightbox{padding:10px;}
      .image-lightbox-panel{width:calc(100vw - 20px);height:calc(100vh - 20px);border-radius:12px;}
      .image-lightbox-toolbar{padding:8px;min-height:50px;}
      .image-lightbox-help{display:none;}
      .image-lightbox-btn{min-width:34px;height:34px;padding:0 8px;}
      .image-lightbox-btn.zoom-value{min-width:50px;}
      .image-lightbox-dismiss.top,.image-lightbox-dismiss.bottom{height:10px;}
      .image-lightbox-dismiss.left,.image-lightbox-dismiss.right{width:10px;}
    }
    @media (prefers-reduced-motion:reduce){
      .step-shot img,.step-shot::after,.image-lightbox,.image-lightbox-panel,.image-lightbox-btn{transition:none !important;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brandline">
          <img class="brandlogo" src="./asset/logo.png" alt="KNOC">
          <h1>AI 서비스 가이드북</h1>
          <span class="beta-badge">beta 버전</span>
        </div>
        <div class="sub">기능 중심으로 정리한 서비스별 사용 안내</div>
      </div>
      <div class="actions">
        <a class="btn" href="./index.html">AI Field</a>
        <a class="btn" href="./prompts.html">프롬프트 예시</a>
        <a class="btn primary" href="./guidebooks.html">가이드 목록</a>
      </div>
    </header>

    <div id="app"></div>
  </div>

  <div class="image-lightbox" id="imageLightbox" aria-hidden="true">
    <div class="image-lightbox-backdrop" data-lightbox-action="close" aria-hidden="true"></div>
    <button class="image-lightbox-dismiss top" type="button" tabindex="-1" data-lightbox-action="close" aria-label="확대 이미지 닫기"></button>
    <button class="image-lightbox-dismiss bottom" type="button" tabindex="-1" data-lightbox-action="close" aria-label="확대 이미지 닫기"></button>
    <button class="image-lightbox-dismiss left" type="button" tabindex="-1" data-lightbox-action="close" aria-label="확대 이미지 닫기"></button>
    <button class="image-lightbox-dismiss right" type="button" tabindex="-1" data-lightbox-action="close" aria-label="확대 이미지 닫기"></button>
    <section class="image-lightbox-panel" role="dialog" aria-modal="true" aria-labelledby="imageLightboxTitle">
      <div class="image-lightbox-toolbar">
        <div class="image-lightbox-heading">
          <strong class="image-lightbox-title" id="imageLightboxTitle">이미지 확대 보기</strong>
          <span class="image-lightbox-help">마우스 휠로 확대·축소하고 드래그해서 이동합니다.</span>
        </div>
        <div class="image-lightbox-actions">
          <button class="image-lightbox-btn" type="button" data-lightbox-action="zoom-out" aria-label="축소">−</button>
          <button class="image-lightbox-btn zoom-value" type="button" data-lightbox-action="reset" aria-label="확대 비율 초기화">100%</button>
          <button class="image-lightbox-btn" type="button" data-lightbox-action="zoom-in" aria-label="확대">+</button>
          <button class="image-lightbox-btn close" type="button" data-lightbox-action="close" aria-label="확대 이미지 닫기">×</button>
        </div>
      </div>
      <div class="image-lightbox-viewport" id="imageLightboxViewport">
        <img class="image-lightbox-image" id="imageLightboxImage" alt="">
      </div>
    </section>
  </div>

  <script src="./guidebook-data.js?v=20260825-10"></script>
  <script>
    const $app = document.querySelector("#app");
    const data = window.SERVICE_GUIDES || { services: [] };
    const READY_GUIDES = new Set(["chatgpt", "genspark", "lilysai", "gemini", "notebooklm"]);

    function esc(v){
      return String(v ?? "").replace(/[&<>"']/g, (ch) => ({
        "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#39;"
      }[ch]));
    }

    function polite(v){
      let text = String(v ?? "");
      const rules = [
        [/해야 한다(?=\.|$)/g, "해야 합니다"],
        [/사용한다(?=\.|$)/g, "사용합니다"],
        [/활용한다(?=\.|$)/g, "활용합니다"],
        [/확인한다(?=\.|$)/g, "확인합니다"],
        [/선택한다(?=\.|$)/g, "선택합니다"],
        [/입력한다(?=\.|$)/g, "입력합니다"],
        [/요청한다(?=\.|$)/g, "요청합니다"],
        [/생성한다(?=\.|$)/g, "생성합니다"],
        [/정리한다(?=\.|$)/g, "정리합니다"],
        [/작성한다(?=\.|$)/g, "작성합니다"],
        [/분석한다(?=\.|$)/g, "분석합니다"],
        [/변환한다(?=\.|$)/g, "변환합니다"],
        [/만든다(?=\.|$)/g, "만듭니다"],
        [/올린다(?=\.|$)/g, "올립니다"],
        [/열어 본다(?=\.|$)/g, "열어 봅니다"],
        [/본다(?=\.|$)/g, "봅니다"],
        [/쓴다(?=\.|$)/g, "사용합니다"],
        [/준다(?=\.|$)/g, "줍니다"],
        [/된다(?=\.|$)/g, "됩니다"],
        [/있다(?=\.|$)/g, "있습니다"],
        [/없다(?=\.|$)/g, "없습니다"],
        [/좋다(?=\.|$)/g, "좋습니다"],
        [/쉽다(?=\.|$)/g, "쉽습니다"],
        [/어렵다(?=\.|$)/g, "어렵습니다"],
        [/강하다(?=\.|$)/g, "강합니다"],
        [/적합하다(?=\.|$)/g, "적합합니다"],
        [/필요하다(?=\.|$)/g, "필요합니다"],
        [/중요하다(?=\.|$)/g, "중요합니다"],
        [/가능하다(?=\.|$)/g, "가능합니다"],
        [/한다(?=\.|$)/g, "합니다"]
      ];
      for(const [from, to] of rules) text = text.replace(from, to);
      return text;
    }

    function copy(v){
      return esc(polite(v));
    }

    function serviceUrl(id){
      return `./guidebooks.html?service=${encodeURIComponent(id)}`;
    }

    function featureUrl(serviceId, index){
      return `${serviceUrl(serviceId)}&feature=${encodeURIComponent(index)}`;
    }

    function currentService(){
      const params = new URLSearchParams(location.search);
      const id = params.get("service") || "";
      return data.services.find((it) => it.id === id) || null;
    }

    function currentFeatureIndex(service){
      const params = new URLSearchParams(location.search);
      if(!params.has("feature")) return null;
      const idx = Number(params.get("feature"));
      const features = service.sections || [];
      if(!Number.isInteger(idx) || idx < 0 || idx >= features.length) return null;
      return idx;
    }

    function faviconUrl(domain){
      return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
    }

    function serviceCardClass(service){
      return READY_GUIDES.has(service.id) ? " is-ready" : " is-muted";
    }

    function asList(value){
      if(Array.isArray(value)) return value.filter(Boolean);
      const text = String(value || "").trim();
      if(!text) return [];
      return text.split(/\n+/).map((it) => it.trim()).filter(Boolean);
    }

    function defaultSteps(feature){
      const explicit = asList(feature.steps);
      if(explicit.length) return explicit.map((step, idx) => {
        if(typeof step === "object" && step !== null){
          return {
            title: step.title || `따라하기 ${idx + 1}`,
            body: step.body || step.text || "",
            image: step.image || feature.image,
            hideImage: Boolean(step.hideImage),
            badge: step.badge || (idx === 0 ? "클릭할 곳" : "확인할 곳")
          };
        }
        return {
          title: `따라하기 ${idx + 1}`,
          body: step,
          image: feature.image,
          badge: idx === 0 ? "클릭할 곳" : "확인할 곳"
        };
      });
      return [
        { title: "기능 버튼이나 입력창을 찾습니다", body: feature.location || "서비스 화면에서 이 기능을 실행하는 버튼이나 입력창을 찾습니다.", image: feature.image, badge: "클릭할 곳" },
        { title: "요청 내용을 입력합니다", body: feature.how || "원하는 결과물, 참고 자료, 조건을 입력합니다.", image: feature.image, badge: "입력할 곳" },
        { title: "결과를 확인하고 수정합니다", body: "생성된 결과를 확인한 뒤 필요한 부분을 다시 요청하거나 업무 문서에 맞게 정리합니다.", image: feature.image, badge: "확인할 곳" }
      ];
    }

    function renderList(){
      const services = data.services;
      $app.innerHTML = `
        <section class="panel" aria-labelledby="guideListTitle">
          <div class="panel-hd">
            <div>
              <h2 class="panel-title" id="guideListTitle">서비스 선택</h2>
              <div class="panel-meta">기능과 업무 적용 방식만 정리했습니다.</div>
            </div>
            <div class="panel-count">전체 ${services.length}개</div>
          </div>
          <div class="panel-bd">
            <div class="guide-grid">
              ${services.map((s) => `
                <a class="service-card${s.id === "notebooklm" ? " service-notebooklm" : s.id === "gemini" ? " service-gemini" : ""}${serviceCardClass(s)}" href="${serviceUrl(s.id)}" style="--accent:${esc(s.tone || "#5eead4")}">
                  <img class="service-hero" src="${esc(s.hero)}" alt="${esc(s.display)} 화면">
                  <div>
                    <h3 class="service-name">${esc(s.display)}</h3>
                    <p class="service-role">${esc(polite(s.role || s.overview))}</p>
                    <div class="chips">
                      ${(s.features || []).slice(0, 9).map((f) => `<span class="chip">${esc(f)}</span>`).join("")}
                    </div>
                  </div>
                </a>
              `).join("")}
            </div>
          </div>
        </section>
      `;
    }

    function renderSide(activeId){
      return `
        <aside class="panel side">
          <div class="panel-hd">
            <div>
              <h2 class="panel-title">서비스</h2>
              <div class="panel-meta">${data.services.length}개 가이드</div>
            </div>
          </div>
          <div class="panel-bd">
            <div class="side-list">
              ${data.services.map((s) => `
                <a class="side-link${s.id === activeId ? " active" : ""}${serviceCardClass(s)}" href="${serviceUrl(s.id)}">
                  <span class="dot" style="background:${esc(s.tone || "#5eead4")}"></span>
                  <span>${esc(s.name)}</span>
                </a>
              `).join("")}
            </div>
          </div>
        </aside>
      `;
    }

    function renderFeatureIndex(service, features){
      return `
        <div class="section-head">
          <h3>기능별 사용법</h3>
        </div>
        <div class="feature-list">
          ${features.map((f, idx) => `
            <a class="feature feature-link" href="${featureUrl(service.id, idx)}">
              <img src="${esc(f.image || service.hero)}" alt="${esc(service.display)} - ${esc(f.title)}">
              <div class="feature-body">
                <h4>${esc(f.title)}</h4>
                <p class="feature-summary">${copy(f.when || f.how || f.location)}</p>
                <div class="feature-footer">
                  <span>자세히 보기</span>
                </div>
              </div>
            </a>
          `).join("")}
        </div>
      `;
    }

    function renderFeatureNav(service, activeIdx){
      const features = service.sections || [];
      return `
        <aside class="panel feature-nav">
          <div class="panel-hd">
            <div>
              <h3 class="panel-title">기능 목록</h3>
              <div class="panel-meta">세부 기능 목록</div>
            </div>
          </div>
          <div class="panel-bd">
            <div class="feature-nav-list">
              ${features.map((f, idx) => `
                <a class="feature-nav-link${idx === activeIdx ? " active" : ""}" href="${featureUrl(service.id, idx)}">
                  ${esc(f.title)}
                </a>
              `).join("")}
            </div>
          </div>
        </aside>
      `;
    }

    function renderFeatureDetail(service, feature, idx){
      const features = service.sections || [];
      const steps = defaultSteps(feature);
      const audioSamples = asList(feature.audioSamples);
      const videoSamples = asList(feature.videoSamples);
      const imageSamples = asList(feature.imageSamples);
      return `
        <div class="section-head">
          <h3>기능 상세</h3>
          ${service.id === "notebooklm" ? "" : `<a class="btn" href="${serviceUrl(service.id)}">기능 목록</a>`}
        </div>
        <div class="feature-detail-shell">
          <section class="feature-detail-head">
            <div class="crumb">
              <a href="${serviceUrl(service.id)}">${esc(service.display)}</a>
              <span>/</span>
              <span>${esc(feature.title)}</span>
            </div>
            <h3>${esc(feature.title)}</h3>
            <p>${copy(feature.when || service.role)}</p>
          </section>

          <div class="detail-flow">
            <section class="detail-block full">
              <h4>따라하기</h4>
              <ol class="step-list">
                ${steps.map((step, stepIdx) => `
                  <li class="step-card">
                    ${step.hideImage ? "" : `
                      <div class="step-shot">
                        <img class="zoomable-guide-image" tabindex="0" role="button" aria-label="이미지 확대 보기: ${esc(step.title || `따라하기 ${stepIdx + 1}`)}" src="${esc(step.image || feature.image || service.hero)}" alt="${esc(feature.title)} - ${esc(step.title || `따라하기 ${stepIdx + 1}`)}">
                        <span class="step-badge">${esc(step.badge || "확인할 곳")}</span>
                      </div>
                    `}
                    <div class="step-copy">
                      <span class="step-title"><span class="step-no">${stepIdx + 1}</span>${esc(step.title || `따라하기 ${stepIdx + 1}`)}</span>
                      <span class="step-body">${copy(step.body || step)}</span>
                    </div>
                  </li>
                `).join("")}
              </ol>
            </section>
            ${audioSamples.length ? `
              <section class="detail-block full">
                <h4>결과물 샘플</h4>
                <div class="audio-samples">
                  ${audioSamples.map((sample, sampleIdx) => `
                    <div class="audio-card">
                      <div class="audio-card-head">
                        <span>${esc(sample.title || `결과물 ${sampleIdx + 1}`)}</span>
                        <span class="audio-duration">${esc(sample.duration || "")}</span>
                      </div>
                      <audio controls preload="metadata" src="${esc(sample.src)}"></audio>
                    </div>
                  `).join("")}
                </div>
              </section>
            ` : ""}
            ${videoSamples.length ? `
              <section class="detail-block full">
                <h4>결과물 샘플</h4>
                <div class="video-samples">
                  ${videoSamples.map((sample, sampleIdx) => `
                    <div class="video-card">
                      <div class="video-card-head">
                        <span>${esc(sample.title || `결과물 ${sampleIdx + 1}`)}</span>
                        <span class="video-duration">${esc(sample.duration || "")}</span>
                      </div>
                      <video controls preload="metadata" src="${esc(sample.src)}"></video>
                    </div>
                  `).join("")}
                </div>
              </section>
            ` : ""}
            ${imageSamples.length ? `
              <section class="detail-block full">
                <h4>결과물 샘플</h4>
                <div class="image-samples">
                  ${imageSamples.map((sample, sampleIdx) => `
                    <div class="image-card">
                      <div class="image-card-head">${esc(sample.title || `결과물 ${sampleIdx + 1}`)}</div>
                      <img class="zoomable-guide-image" tabindex="0" role="button" aria-label="이미지 확대 보기: ${esc(sample.title || `결과물 ${sampleIdx + 1}`)}" src="${esc(sample.src)}" alt="${esc(sample.title || `결과물 ${sampleIdx + 1}`)}">
                    </div>
                  `).join("")}
                </div>
              </section>
            ` : ""}
          </div>
        </div>
      `;
    }

    function renderDetail(service){
      const features = service.sections || [];
      const keyFeatures = (service.features || []).slice(0, 9);
      const featureIdx = currentFeatureIndex(service);
      const selectedFeature = featureIdx === null ? null : features[featureIdx];
      const guideDate = service.guideDate || ((service.basis || "").match(/\d{4}-\d{2}-\d{2}/) || [data.generatedAt || ""])[0];
      $app.innerHTML = `
        <div class="detail-layout">
          ${selectedFeature ? renderFeatureNav(service, featureIdx) : renderSide(service.id)}
          <main${service.id === "notebooklm" ? ` class="service-notebooklm"` : service.id === "gemini" ? ` class="service-gemini"` : ""}>
            <section class="hero${service.id === "notebooklm" ? " hero-light" : ""}" style="--accent:${esc(service.tone || "#5eead4")}">
              <div class="hero-copy">
                ${guideDate ? `<div class="guide-date">작성 기준일: ${esc(guideDate)}</div>` : ""}
                <h2>${esc(service.display)}</h2>
                <p>${copy(service.overview || service.role)}</p>
                <div class="chips">
                  ${keyFeatures.map((f) => `<span class="chip">${esc(f)}</span>`).join("")}
                </div>
              </div>
            </section>

            ${selectedFeature ? renderFeatureDetail(service, selectedFeature, featureIdx) : renderFeatureIndex(service, features)}
          </main>
        </div>
      `;
    }

    const $lightbox = document.querySelector("#imageLightbox");
    const $lightboxViewport = document.querySelector("#imageLightboxViewport");
    const $lightboxImage = document.querySelector("#imageLightboxImage");
    const $lightboxTitle = document.querySelector("#imageLightboxTitle");
    const $lightboxZoomValue = document.querySelector('[data-lightbox-action="reset"]');
    const lightboxState = { scale:1, x:0, y:0, dragging:false, pointerId:null, startX:0, startY:0, originX:0, originY:0, opener:null, closeTimer:null };

    function clamp(value, min, max){
      return Math.min(max, Math.max(min, value));
    }

    function clampLightboxPan(){
      const viewportRect = $lightboxViewport.getBoundingClientRect();
      const baseWidth = $lightboxImage.offsetWidth;
      const baseHeight = $lightboxImage.offsetHeight;
      const maxX = Math.max(0, (baseWidth * lightboxState.scale - viewportRect.width) / 2);
      const maxY = Math.max(0, (baseHeight * lightboxState.scale - viewportRect.height) / 2);
      lightboxState.x = clamp(lightboxState.x, -maxX, maxX);
      lightboxState.y = clamp(lightboxState.y, -maxY, maxY);
    }

    function paintLightboxImage(){
      clampLightboxPan();
      $lightboxImage.style.transform = `translate3d(${lightboxState.x}px,${lightboxState.y}px,0) scale(${lightboxState.scale})`;
      $lightboxZoomValue.textContent = `${Math.round(lightboxState.scale * 100)}%`;
    }

    function setLightboxZoom(nextScale, clientX, clientY){
      const oldScale = lightboxState.scale;
      const newScale = clamp(nextScale, 1, 5);
      if(newScale === oldScale) return;
      const rect = $lightboxViewport.getBoundingClientRect();
      const focusX = Number.isFinite(clientX) ? clientX - rect.left - rect.width / 2 : 0;
      const focusY = Number.isFinite(clientY) ? clientY - rect.top - rect.height / 2 : 0;
      const ratio = newScale / oldScale;
      lightboxState.x = focusX - (focusX - lightboxState.x) * ratio;
      lightboxState.y = focusY - (focusY - lightboxState.y) * ratio;
      lightboxState.scale = newScale;
      paintLightboxImage();
    }

    function resetLightbox(){
      lightboxState.scale = 1;
      lightboxState.x = 0;
      lightboxState.y = 0;
      paintLightboxImage();
    }

    function openLightbox(image){
      if(lightboxState.closeTimer) clearTimeout(lightboxState.closeTimer);
      lightboxState.opener = image;
      $lightboxImage.src = image.currentSrc || image.src;
      $lightboxImage.alt = image.alt || "확대 이미지";
      $lightboxTitle.textContent = image.alt || "이미지 확대 보기";
      resetLightbox();
      document.body.classList.add("lightbox-open");
      $lightbox.setAttribute("aria-hidden", "false");
      requestAnimationFrame(() => $lightbox.classList.add("is-open"));
      $lightbox.querySelector('.image-lightbox-btn.close').focus({ preventScroll:true });
    }

    function closeLightbox(){
      if(!$lightbox.classList.contains("is-open")) return;
      $lightbox.classList.remove("is-open");
      $lightbox.setAttribute("aria-hidden", "true");
      lightboxState.dragging = false;
      lightboxState.pointerId = null;
      $lightboxViewport.classList.remove("is-dragging");
      lightboxState.closeTimer = setTimeout(() => {
        document.body.classList.remove("lightbox-open");
        $lightboxImage.removeAttribute("src");
        lightboxState.opener?.focus({ preventScroll:true });
        lightboxState.opener = null;
      }, 360);
    }

    document.addEventListener("click", (event) => {
      const image = event.target.closest(".zoomable-guide-image");
      if(image){
        openLightbox(image);
        return;
      }
      const action = event.target.closest("[data-lightbox-action]")?.dataset.lightboxAction;
      if(action === "close") closeLightbox();
      else if(action === "zoom-in") setLightboxZoom(lightboxState.scale * 1.25);
      else if(action === "zoom-out") setLightboxZoom(lightboxState.scale / 1.25);
      else if(action === "reset") resetLightbox();
      else if(event.target === $lightbox) closeLightbox();
    });

    document.addEventListener("keydown", (event) => {
      const image = event.target.closest?.(".zoomable-guide-image");
      if(image && (event.key === "Enter" || event.key === " ")){
        event.preventDefault();
        openLightbox(image);
        return;
      }
      if(!$lightbox.classList.contains("is-open")) return;
      if(event.key === "Escape") closeLightbox();
      else if(event.key === "+" || event.key === "=") setLightboxZoom(lightboxState.scale * 1.25);
      else if(event.key === "-") setLightboxZoom(lightboxState.scale / 1.25);
      else if(event.key === "0") resetLightbox();
    });

    $lightboxViewport.addEventListener("wheel", (event) => {
      event.preventDefault();
      const factor = Math.exp(-event.deltaY * .0015);
      setLightboxZoom(lightboxState.scale * factor, event.clientX, event.clientY);
    }, { passive:false });

    $lightboxViewport.addEventListener("pointerdown", (event) => {
      if(event.button !== 0 || lightboxState.scale <= 1) return;
      lightboxState.dragging = true;
      lightboxState.pointerId = event.pointerId;
      lightboxState.startX = event.clientX;
      lightboxState.startY = event.clientY;
      lightboxState.originX = lightboxState.x;
      lightboxState.originY = lightboxState.y;
      $lightboxViewport.classList.add("is-dragging");
      $lightboxViewport.setPointerCapture(event.pointerId);
    });

    $lightboxViewport.addEventListener("pointermove", (event) => {
      if(!lightboxState.dragging || event.pointerId !== lightboxState.pointerId) return;
      lightboxState.x = lightboxState.originX + event.clientX - lightboxState.startX;
      lightboxState.y = lightboxState.originY + event.clientY - lightboxState.startY;
      paintLightboxImage();
    });

    function stopLightboxDrag(event){
      if(event.pointerId !== lightboxState.pointerId) return;
      lightboxState.dragging = false;
      lightboxState.pointerId = null;
      $lightboxViewport.classList.remove("is-dragging");
    }

    $lightboxViewport.addEventListener("pointerup", stopLightboxDrag);
    $lightboxViewport.addEventListener("pointercancel", stopLightboxDrag);
    $lightboxViewport.addEventListener("dblclick", (event) => {
      if(lightboxState.scale > 1) resetLightbox();
      else setLightboxZoom(2, event.clientX, event.clientY);
    });

    window.addEventListener("resize", () => {
      if($lightbox.classList.contains("is-open")) paintLightboxImage();
    });

    const selected = currentService();
    if(selected) renderDetail(selected);
    else renderList();
  </script>
</body>
</html>
